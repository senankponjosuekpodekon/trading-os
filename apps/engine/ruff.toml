# Ruff — lint Python engine (Sprint qualité)
line-length = 120
target-version = "py313"

[lint]
# E4/E7/E9 : erreurs pycodestyle critiques | F : pyflakes (imports/variables inutilisés, etc.)
# B : bugbear (pièges courants) | I : tri des imports
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "B008",  # function call in default argument (pattern FastAPI Depends)
    "E731",  # lambda assignment
    "E701",  # one-liner if: statement (style legacy assumé)
    "E702",  # one-liner avec ; (style legacy assumé)
    "E741",  # variable ambiguë (l pour low, usage cohérent OHLC)
    "B905",  # zip sans strict= (comportement historique conservé)
]

[lint.per-file-ignores]
"tests/*" = ["F841", "E402"]  # E402 : sys.path.insert avant les imports
"main.py" = ["E402"]  # warnings.filterwarnings must run before imports
