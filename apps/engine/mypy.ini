[mypy]
python_version = 3.12
warn_return_any = False
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
disallow_untyped_decorators = False
no_implicit_optional = True
warn_no_return = True
warn_unreachable = True
show_error_codes = True
show_column_numbers = True
pretty = True
disable_error_code = type-arg, import-untyped, import-not-found, no-any-return, no-untyped-def, no-untyped-call

# Progressive: start with warnings, not errors
# Phase 1: scan.py + indicators + utils
[mypy-routers.scan]
warn_return_any = True
check_untyped_defs = True

[mypy-indicators.*]
strict = True

[mypy-utils.*]
check_untyped_defs = True

# Third-party libs without stubs
[mypy-pandas_ta.*]
ignore_missing_imports = True

[mypy-ccxt.*]
ignore_missing_imports = True

