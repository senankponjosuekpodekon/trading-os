name: Build and Push to GHCR

on:
  push:
    branches: [vps]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:3001' }}
            NEXT_PUBLIC_ENGINE_URL=${{ vars.NEXT_PUBLIC_ENGINE_URL || 'http://localhost:8000' }}
            NEXT_PUBLIC_ENGINE_WS_URL=${{ vars.NEXT_PUBLIC_ENGINE_WS_URL || 'ws://localhost:8000' }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL || 'ws://localhost:3001' }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN || '' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  build-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-engine
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          context: apps/engine
          file: apps/engine/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=engine
          cache-to: type=gha,scope=engine,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build-api, build-web, build-engine]
    environment: production
    steps:
      - name: Deploy to VPS
        env:
          SHA: ${{ github.sha }}
          GHCR_USER: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_PASS: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          IMAGE_PREFIX: ${{ github.repository }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.PROD_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" \
            "cd /root/projects/trading-os && \
             docker login ghcr.io -u '${GHCR_USER}' -p '${GHCR_PASS}' && \
             docker pull ghcr.io/${IMAGE_PREFIX}-api:${SHA} && \
             docker pull ghcr.io/${IMAGE_PREFIX}-web:${SHA} && \
             docker pull ghcr.io/${IMAGE_PREFIX}-engine:${SHA} && \
             docker tag ghcr.io/${IMAGE_PREFIX}-api:${SHA} trading-os-api:latest && \
             docker tag ghcr.io/${IMAGE_PREFIX}-web:${SHA} trading-os-web:latest && \
             docker tag ghcr.io/${IMAGE_PREFIX}-engine:${SHA} trading-os-engine:latest && \
             docker compose -f docker-compose.prod.yml up -d && \
             echo 'Deployment complete'"
