name: Build and Push to GHCR

on:
  push:
    branches: [vps]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://trading.stiamond.net
            NEXT_PUBLIC_ENGINE_URL=http://169.58.80.46:8000
            NEXT_PUBLIC_ENGINE_WS_URL=ws://169.58.80.46:8000
            NEXT_PUBLIC_WS_URL=wss://trading.stiamond.net
            NEXT_PUBLIC_SENTRY_DSN=
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  build-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-engine
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          context: apps/engine
          file: apps/engine/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=engine
          cache-to: type=gha,scope=engine,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build-api, build-web, build-engine]
    if: github.ref == 'refs/heads/vps' && github.repository == 'senankponjosuekpodekon/trading-os'
    environment: production
    steps:
      - name: Check deployment secrets
        shell: bash
        run: |
          : "${{ secrets.PROD_HOST }}"
          : "${{ secrets.PROD_USER }}"
          : "${{ secrets.PROD_SSH_KEY }}"
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        env:
          GHCR_USER: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_PASS: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          IMAGE_PREFIX: ${{ github.repository }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          script_stop: true
          envs: GHCR_USER,GHCR_PASS,IMAGE_PREFIX
          script: |
            set -euo pipefail
            cd /root/projects/trading-os
            echo "$GHCR_PASS" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull ghcr.io/${IMAGE_PREFIX}-api:latest
            docker pull ghcr.io/${IMAGE_PREFIX}-web:latest
            docker pull ghcr.io/${IMAGE_PREFIX}-engine:latest
            docker tag ghcr.io/${IMAGE_PREFIX}-api:latest trading-os-api:latest
            docker tag ghcr.io/${IMAGE_PREFIX}-web:latest trading-os-web:latest
            docker tag ghcr.io/${IMAGE_PREFIX}-engine:latest trading-os-engine:latest
            docker network create postgres_default 2>/dev/null || true
            docker network create ollama_default 2>/dev/null || true
            docker compose -f docker-compose.prod.yml up -d
            echo 'Deployment complete'
