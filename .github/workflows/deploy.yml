name: Deploy

on:
  workflow_run:
    workflows: ["Build and Push to GHCR"]
    types:
      - completed
    branches: [vps]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.PROD_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          SHA=${{ github.event.workflow_run.head_sha }}
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" \
            "cd /root/projects/trading-os && \
             docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} && \
             docker pull ghcr.io/${{ github.repository }}/trading-os-api:$SHA && \
             docker pull ghcr.io/${{ github.repository }}/trading-os-web:$SHA && \
             docker pull ghcr.io/${{ github.repository }}/trading-os-engine:$SHA && \
             docker tag ghcr.io/${{ github.repository }}/trading-os-api:$SHA trading-os-api:latest && \
             docker tag ghcr.io/${{ github.repository }}/trading-os-web:$SHA trading-os-web:latest && \
             docker tag ghcr.io/${{ github.repository }}/trading-os-engine:$SHA trading-os-engine:latest && \
             docker compose -f docker-compose.prod.yml up -d && \
             echo 'Deployment complete'"
