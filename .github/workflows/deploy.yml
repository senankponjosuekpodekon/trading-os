name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy to VPS
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          GHCR_USER: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_PASS: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.PROD_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" \
            "cd /root/projects/trading-os && \
             docker login ghcr.io -u '${GHCR_USER}' -p '${GHCR_PASS}' && \
             docker pull ghcr.io/${IMAGE_PREFIX}-api:${SHA} && \
             docker pull ghcr.io/${IMAGE_PREFIX}-web:${SHA} && \
             docker pull ghcr.io/${IMAGE_PREFIX}-engine:${SHA} && \
             docker tag ghcr.io/${IMAGE_PREFIX}-api:${SHA} trading-os-api:latest && \
             docker tag ghcr.io/${IMAGE_PREFIX}-web:${SHA} trading-os-web:latest && \
             docker tag ghcr.io/${IMAGE_PREFIX}-engine:${SHA} trading-os-engine:latest && \
             docker compose -f docker-compose.prod.yml up -d && \
             echo 'Deployment complete'"
