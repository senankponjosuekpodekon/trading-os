name: CI

on:
  push:
    branches: [main, develop, dev, vps]
  pull_request:
    branches: [main, develop, dev, vps]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: trading_user
          POSTGRES_PASSWORD: trading_pass
          POSTGRES_DB: app
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U trading_user -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --legacy-peer-deps
      - run: npx prisma generate --schema=apps/api/prisma/schema.prisma
      - run: npm run lint --workspace=apps/api
      - run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://trading_user:trading_pass@localhost:5433/app
      - run: npx tsc --noEmit
        working-directory: apps/api
      - run: npx jest --coverage
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://trading_user:trading_pass@localhost:5433/app
          REDIS_URL: redis://localhost:6380

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --legacy-peer-deps
      - run: npm run lint --workspace=apps/web
      - run: npx tsc --noEmit
        working-directory: apps/web
      - run: npx jest --coverage
        working-directory: apps/web

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r apps/engine/requirements.txt -r apps/engine/requirements-test.txt
      - name: Syntax check
        working-directory: apps/engine
        run: |
          python -m py_compile $(git ls-files '*.py' | tr '\n' ' ')
      - name: Ruff lint
        working-directory: apps/engine
        run: ruff check .
      - name: Run Python tests
        working-directory: apps/engine
        env:
          DATABASE_URL: postgresql://trading_user:trading_pass@localhost:5432/app
        run: |
          if [ -d tests ]; then pytest -q; else echo "No tests yet"; fi

  docker:
    runs-on: ubuntu-latest
    needs: [api, web, engine]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t trading-os-api ./apps/api
      - name: Build Web image
        run: docker build -t trading-os-web -f apps/web/Dockerfile .
      - name: Build Engine image
        run: docker build -t trading-os-engine ./apps/engine
