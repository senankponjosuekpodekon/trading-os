services:
  engine:
    build:
      context: ./apps/engine
      dockerfile: Dockerfile
    container_name: trading-os-engine
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://host.docker.internal:6379
      ENGINE_API_KEY: ${ENGINE_API_KEY:-}
      # Market data
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      DERIV_API_TOKEN: ${DERIV_API_TOKEN:-}
      # On-chain / social / funding
      COINALYZE_API_KEY: ${COINALYZE_API_KEY:-}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
      WHALE_ALERT_API_KEY: ${WHALE_ALERT_API_KEY:-}
      LUNARCRUSH_API_KEY: ${LUNARCRUSH_API_KEY:-}
      # AI / LLM
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      # News / sentiment
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      # Monitoring
      SENTRY_DSN_ENGINE: ${SENTRY_DSN_ENGINE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
      # Engine config
      ENGINE_PORT: "8000"
      API_URL: ${API_URL:-http://host.docker.internal:3002}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      OLLAMA_TIMEOUT_S: ${OLLAMA_TIMEOUT_S:-20}
      # Risk management
      RISK_INITIAL_CAPITAL: ${RISK_INITIAL_CAPITAL:-10000}
      RISK_BASE_PCT: ${RISK_BASE_PCT:-1.0}
    volumes:
      - ./apps/engine:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: trading-os-api
    ports:
      - "3002:3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_RUNTIME_DATABASE_URL: postgresql://${APP_RUNTIME_USER}:${APP_RUNTIME_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://host.docker.internal:6379
      ENGINE_URL: http://host.docker.internal:8000
      ENGINE_API_KEY: ${ENGINE_API_KEY:-}
      API_PORT: "3001"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 15m
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SENTRY_DSN_API: ${SENTRY_DSN_API:-}
      NODE_ENV: production
    volumes:
      - ./apps/api:/app
      - /app/node_modules
      - /app/dist
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: trading-os-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3002}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3002}
      NEXT_PUBLIC_GRAFANA_URL: ${NEXT_PUBLIC_GRAFANA_URL:-http://localhost:3003}
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    depends_on:
      - api

  loki:
    image: grafana/loki:3.0.0
    container_name: trading-os-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - default

  promtail:
    image: grafana/promtail:3.0.0
    container_name: trading-os-promtail
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - default

  grafana:
    image: grafana/grafana:10.4.0
    container_name: trading-os-grafana
    ports:
      - "3003:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - default

networks:
  default:
    external:
      name: postgres_default

volumes:
  loki-data:
  grafana-data:
