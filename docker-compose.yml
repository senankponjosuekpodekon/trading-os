services:
  engine:
    build:
      context: ./apps/engine
      dockerfile: Dockerfile
    container_name: trading-os-engine
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://host.docker.internal:6379
    volumes:
      - ./apps/engine:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: trading-os-api
    ports:
      - "3002:3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://host.docker.internal:6379
      ENGINE_URL: http://host.docker.internal:8000
      API_PORT: "3001"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 15m
    volumes:
      - ./apps/api:/app
      - /app/node_modules
      - /app/dist
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      engine:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: trading-os-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://169.58.80.46:3002
      NEXT_PUBLIC_WS_URL: ws://169.58.80.46:3002
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    depends_on:
      - api

networks:
  default:
    external:
      name: postgres_default
