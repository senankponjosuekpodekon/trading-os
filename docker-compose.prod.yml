# Production compose for this VPS: builds images locally (no ghcr.io/CI
# dependency — the registry-based pipeline in .github/workflows/deploy.yml
# is not wired to this server). Postgres and Redis are NOT managed here:
# this VPS already runs them as standalone containers (see `docker ps`,
# networks postgres_default / redis_default) with real production data.
# Backups are handled by scripts/backup-db.sh (cron), and TLS/reverse-proxy
# by nginx-proxy-manager — hence no "backup" or "nginx" service here.
services:

  engine:
    build:
      context: ./apps/engine
      dockerfile: Dockerfile
    container_name: trading-os-engine-prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://host.docker.internal:6379
      ENGINE_API_KEY: ${ENGINE_API_KEY:?ENGINE_API_KEY is required}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    ports:
      - "${ENGINE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: trading-os-api-prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://host.docker.internal:6379
      ENGINE_URL: http://engine:8000
      ENGINE_API_KEY: ${ENGINE_API_KEY:?ENGINE_API_KEY is required}
      API_PORT: ${API_PORT:-3001}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT_HOST:-3002}:3001"
    depends_on:
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_ENGINE_URL: ${NEXT_PUBLIC_ENGINE_URL}
        NEXT_PUBLIC_ENGINE_WS_URL: ${NEXT_PUBLIC_ENGINE_WS_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
    container_name: trading-os-web-prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3001}
    ports:
      - "${WEB_PORT_HOST:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  default:
    external:
      name: postgres_default
